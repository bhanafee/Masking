buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'com.palantir.git-version' version '3.1.0' apply false
    alias(libs.plugins.spotless) apply false
    alias(libs.plugins.owasp.dependencycheck) apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'jvm-test-suite'
    apply plugin: 'maven-publish'
    apply plugin: 'jacoco'
    apply plugin: 'com.palantir.git-version'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'org.owasp.dependencycheck'

    group = 'com.maybeitssquid'
    version = gitVersion().replaceAll('^v', '')  // Strip 'v' prefix from git tags

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
        }
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        constraints {
            libs.bundles.security.patches.get().each {
                add('implementation', it)
            }
        }
    }

    testing {
        suites.test {
            useJUnitJupiter(libs.versions.junit)
            dependencies {
                implementation libs.assertj.core
                implementation libs.mockito.core
                implementation libs.mockito.junit.jupiter
            }
        }
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.named('test')
        reports {
            html.required = true
            xml.required = false
        }
    }

    spotless {
        java {
            targetExclude 'src/*/java/module-info.java'
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    dependencyCheck {
        failBuildOnCVSS = 7
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = libs.versions.release.get().toInteger()
    }

    tasks.withType(Javadoc).configureEach {
        options {
            encoding = 'UTF-8'
            links "https://docs.oracle.com/en/java/javase/${libs.versions.java.get()}/docs/api/"
            addBooleanOption('html5', true)
        }
    }

    publishing {
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri("https://maven.pkg.github.com/${System.env.GITHUB_REPOSITORY ?: 'bhanafee/Masking'}")
                credentials {
                    username = System.env.USERNAME ?: System.env.GITHUB_ACTOR
                    password = System.env.TOKEN ?: System.env.GITHUB_TOKEN
                }
            }
        }
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = project.name
                pom {
                    description = 'Sensitive data protection for Java'
                    url = 'https://github.com/bhanafee/Masking'
                    licenses {
                        license {
                            name = 'Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0'
                        }
                    }
                    scm {
                        url = 'https://github.com/bhanafee/Masking'
                        connection = 'scm:git:git://github.com/bhanafee/Masking.git'
                        developerConnection = 'scm:git:ssh://github.com/bhanafee/Masking.git'
                    }
                }
            }
        }
    }
}

configure(project(':sensitive')) {
    publishing.publications.mavenJava.pom.name = 'Sensitive'
}

configure(project(':tin')) {
    publishing.publications.mavenJava.pom.name = 'TIN'
}
