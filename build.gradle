buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'java-library'
    id 'jvm-test-suite'
    id 'maven-publish'
    alias(libs.plugins.spotless)
    alias(libs.plugins.owasp.dependencycheck)
}

group = 'com.maybeitssquid'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(libs.versions.java.get()))
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    constraints {
        libs.bundles.security.patches.get().each {
            add('implementation', it)
        }
    }
    implementation libs.slf4j.api
}

testing {
    suites.test {
        useJUnitJupiter(libs.versions.junit)
        dependencies {
            implementation libs.assertj.core
            implementation libs.mockito.core
            implementation libs.mockito.junit.jupiter
        }
    }
}

// Spotless configuration for code formatting
spotless {
    java {
        target 'src/*/java/**/*.java'
        targetExclude 'src/*/java/module-info.java'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// OWASP dependency check configuration
dependencyCheck {
    failBuildOnCVSS = 7  // Fail on high/critical vulnerabilities
}

javadoc {
    options {
        encoding = 'UTF-8'
        links "https://docs.oracle.com/en/java/javase/${libs.versions.java.get()}/docs/api/"
    }
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
}
