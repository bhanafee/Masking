[versions]
# Java toolchain
java = "21"

# Plugin versions
spotless = "6.+"
owasp-dependencycheck = "9.+"

# Testing
junit = "5.+"
assertj = "3.+"
mockito = "5.+"

# Logging
slf4j = "2.+"

[libraries]
# Security patches
patch-cve-2023-33201 = { module = "org.bouncycastle:bcprov-jdk18on", version = { strictly = "[1.74,)", prefer = "1.74" } }
patch-cve-2023-33202 = { module = "org.bouncycastle:bcprov-jdk18on", version = { strictly = "[1.73,)", prefer = "1.73" } }
patch-cve-2024-29857 = { module = "org.bouncycastle:bcprov-jdk18on", version = { strictly = "[1.78,)", prefer = "1.78" } }
patch-cve-2024-30171 = { module = "org.bouncycastle:bcprov-jdk18on", version = { strictly = "[1.78,)", prefer = "1.78" } }
patch-cve-2024-34447 = { module = "org.bouncycastle:bcprov-jdk18on", version = { strictly = "[1.78,)", prefer = "1.78" } }
patch-cve-2025-8885 = { module = "org.bouncycastle:bcprov-jdk18on", version = { strictly = "[1.78,)", prefer = "1.78" } }
patch-cve-2025-48924 = { module = "org.apache.commons:commons-lang3", version = { strictly = "[3.18.0,)", prefer = "3.18.0" } }
patch-cve-2025-4949 = { module = "org.eclipse.jgit:org.eclipse.jgit", version = { strictly = "[6.10.1.202505221210-r,)", prefer = "6.10.1.202505221210-r" } }
patch-cve-2022-45868 = { module = "com.h2database:h2", version = { strictly = "[2.2.220,)", prefer = "2.2.220" } }
patch-ghsa-72hv-8253-57qq = { module = "com.fasterxml.jackson.core:jackson-core", version = { strictly = "[2.18.6,)", prefer = "2.18.6" } }
patch-cve-2025-48734 = { module = "commons-beanutils:commons-beanutils", version = { strictly = "[1.11.0,)", prefer = "1.11.0" } }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[bundles]
security-patches = ["patch-cve-2022-45868", "patch-cve-2023-33201", "patch-cve-2023-33202", "patch-cve-2024-29857", "patch-cve-2024-30171", "patch-cve-2024-34447", "patch-cve-2025-8885", "patch-cve-2025-48924", "patch-cve-2025-4949", "patch-cve-2025-48734", "patch-ghsa-72hv-8253-57qq"]
testing = ["junit-jupiter", "assertj-core", "mockito-core", "mockito-junit-jupiter"]

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependencycheck" }
